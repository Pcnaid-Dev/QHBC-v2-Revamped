<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queen Hair Beauty Center | صالون بيوتي هاوس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ivory: '#F7F6F0',
              surface: '#FFFFFF',
              surface2: 'rgba(255,255,255,0.72)',
              charcoal: '#1A1418',
              muted: '#4D505C',
              pink: '#FF2D9A',
              pink2: '#DF829E',
              gold: '#C4AD70',
              gold2: '#A48643',
              lavender: '#B88BB5',
              orchid: '#502E6C',
            },
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
              arabic: ['Cairo', 'sans-serif'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'shine': 'shine 3s linear infinite',
              'gradient-x': 'gradient-x 15s ease infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              shine: {
                '0%': { backgroundPosition: '200% center' },
                '100%': { backgroundPosition: '-200% center' },
              },
              'gradient-x': {
                '0%, 100%': {
                  'background-size': '200% 200%',
                  'background-position': 'left center'
                },
                '50%': {
                  'background-size': '200% 200%',
                  'background-position': 'right center'
                },
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg: #F7F6F0;
        --pink: #FF2D9A;
        --gold: #C4AD70;
        --orchid: #502E6C;
      }
      body {
        background-color: var(--bg);
        color: #1A1418;
        font-family: 'Poppins', sans-serif;
        overflow-x: hidden;
      }
      .font-arabic {
        font-family: 'Cairo', sans-serif;
      }
      .arch-card {
        border-radius: 12rem 12rem 1rem 1rem;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F7F6F0;
      }
      ::-webkit-scrollbar-thumb {
        background: #C4AD70;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF2D9A;
      }
      .text-shadow-glow {
        text-shadow: 0 0 20px rgba(255, 45, 154, 0.3);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
